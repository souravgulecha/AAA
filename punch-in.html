<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Portal</title>
  <style>
    /* Makes the iframe take up the entire screen to hide the GitHub wrapper */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7f6; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- The allow attribute is critical here to permit biometrics -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxfK07Vnjes24hp4gpu0BwWlfk4QrbCG7S-3x65xEPgdGWBx6RSF38YRf0HFCxOFWcQ/exec" allow="publickey-credentials-get *; publickey-credentials-create *"></iframe>

  <script>
    // Helper functions for cryptography
    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
    function base64ToBuffer(base64) {
      const b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
      const binary = window.atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // Listen for commands from the hidden Google Apps Script iframe
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || !data.msgId) return; // Ignore irrelevant messages

      if (data.action === 'REGISTER_FINGERPRINT') {
        try {
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              rp: { name: "Employee System" },
              user: { id: crypto.getRandomValues(new Uint8Array(16)), name: data.empId, displayName: data.empId },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
              authenticatorSelection: { userVerification: "required" },
              timeout: 60000
            }
          });
          // Send success back to GAS
          event.source.postMessage({ msgId: data.msgId, status: 'SUCCESS', credentialId: bufferToBase64(credential.rawId) }, event.origin);
        } catch (err) {
          event.source.postMessage({ msgId: data.msgId, status: 'ERROR', error: err.message }, event.origin);
        }
      }

      if (data.action === 'PUNCH_IN_FINGERPRINT') {
        try {
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              allowCredentials: [{ id: base64ToBuffer(data.credentialId), type: 'public-key' }],
              userVerification: "required",
              timeout: 60000
            }
          });
          // Send success back to GAS
          event.source.postMessage({ msgId: data.msgId, status: 'SUCCESS', credentialId: bufferToBase64(assertion.rawId) }, event.origin);
        } catch (err) {
          event.source.postMessage({ msgId: data.msgId, status: 'ERROR', error: err.message }, event.origin);
        }
      }
    });
  </script>
</body>
</html>
